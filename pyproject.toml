[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text-collapse-blank-runs"
version = "1.0.0"
description = "Collapse runs of consecutive blank lines into at most N blank lines"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "TataneSan"}]

[project.scripts]
text-collapse-blank-runs = "text_collapse_blank_runs.cli:main"

[tool.setuptools.packages.find]
include = ["text_collapse_blank_runs*"]
